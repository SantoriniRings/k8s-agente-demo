apiVersion: apps/v1
kind: Deployment
metadata:
  name: podinfo
  annotations:
    ignore-check.kube-linter.io/unset-cpu-requirements: "lo resuelvo después"
    ignore-check.kube-linter.io/unset-memory-requirements: "lo resuelvo después"
  namespace: demo
  labels:
    app: podinfo
spec:
  replicas: 2
  selector:
    matchLabels:
      app: podinfo
  template:
    metadata:
      labels:
        app: podinfo
    spec:
      containers:
        - name: podinfo
          image: ghcr.io/stefanprodan/podinfo:6.5.4
          ports:
            - name: http
              containerPort: 9898
