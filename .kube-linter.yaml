# Configuración de kube-linter para la demo.
# Cada exclusión de abajo es deuda técnica con un issue asociado.
# Regla: los cambios a este archivo sólo pueden QUITAR exclusiones o AGREGAR checks.
checks:
  exclude:
    # Fuera del alcance de la demo: la anti-afinidad depende del cluster real.
    - no-anti-affinity
customChecks:
  - name: required-label-app-kubernetes-io-name
    description: Los Deployments deben tener la label app.kubernetes.io/name.
    remediation: Agregar app.kubernetes.io/name en metadata.labels del Deployment.
    template: required-label
    params:
      key: app.kubernetes.io/name
    scope:
      objectKinds:
        - DeploymentLike
